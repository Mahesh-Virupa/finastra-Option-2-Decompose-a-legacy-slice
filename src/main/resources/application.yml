server:
  port: ${PORT:8082}
  shutdown: graceful

spring:
  application:
    name: option2-trade-slice
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:h2:mem:slice;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update               # prototype only: use Flyway migrations in production

management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health.probes.enabled: true

app:
  adapters:
    file-dir: ${ADAPTER_FILE_DIR:./out}
  admin:
    api-key: ${ADMIN_API_KEY:dev-admin-key}

# ---- Option 2: per-tenant POLICY as plain typed configuration (no rule engine; that is Option 1) ----
slice:
  fee-bps: 2                         # was hard-coded 0.0002 in the legacy pipeline
  tenants:
    CLIENT_A:                        # legacy: dual approval > 1M, desk code lookup, 10% discount, file feed
      approval-above: 1000000
      approval-levels: 2
      fee-multiplier: 0.9
      desk-default: DESK-UNASSIGNED
      desk-table: { t1: DESK-NY, t2: DESK-LDN, t3: DESK-SGP }
      adapters: [file-feed]
      mode: SHADOW                   # new service serves; legacy logic runs alongside and is compared
    CLIENT_B:                        # legacy: APAC tax rules, FX routed to the legacy queue
      tax-region: APAC
      fx-route: legacy-fx-queue
      adapters: [webhook]
      mode: NEW

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [tenant=%X{tenant:-}] %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
