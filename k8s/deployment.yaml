apiVersion: apps/v1
kind: Deployment
metadata: { name: trade-slice, labels: { app: trade-slice } }
spec:
  replicas: 2
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: trade-slice } }
  template:
    metadata:
      labels: { app: trade-slice }
      annotations: { prometheus.io/scrape: "true", prometheus.io/path: /actuator/prometheus, prometheus.io/port: "8080" }
    spec:
      terminationGracePeriodSeconds: 30
      securityContext: { runAsNonRoot: true, runAsUser: 100 }
      containers:
        - name: app
          image: option2-trade-slice:1.0.0          # push to your registry and change this
          imagePullPolicy: IfNotPresent
          ports: [ { containerPort: 8080 } ]
          envFrom:
            - configMapRef: { name: trade-slice-config }
            - secretRef: { name: trade-slice-secret }
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 768Mi } }
          startupProbe:   { httpGet: { path: /actuator/health/liveness, port: 8080 }, failureThreshold: 30, periodSeconds: 2 }
          livenessProbe:  { httpGet: { path: /actuator/health/liveness, port: 8080 }, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8080 }, periodSeconds: 5 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: false }
